<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- animated flow line: pipeline motif -->
  <path id="flowpath" d="M 780 90 L 900 90 L 900 160 L 1020 160 L 1020 70 L 1130 70"
        stroke="#30363d" stroke-width="1.5" fill="none"/>
  <path d="M 900 160 L 900 230 L 1040 230"
        stroke="#30363d" stroke-width="1.5" fill="none"/>

  <g fill="#00c896">
    <circle cx="780" cy="90" r="4"/>
    <circle cx="900" cy="90" r="4"/>
    <circle cx="900" cy="160" r="4"/>
    <circle cx="1020" cy="160" r="4"/>
    <circle cx="1020" cy="70" r="4"/>
    <circle cx="1130" cy="70" r="4"/>
    <circle cx="900" cy="230" r="4"/>
    <circle cx="1040" cy="230" r="4"/>
  </g>

  <!-- moving data packet along the pipeline -->
  <circle r="5" fill="#00c896">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#flowpath"/>
    </animateMotion>
  </circle>

  <!-- headline -->
  <text x="60" y="95" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">
    Hi, I'm
  </text>
  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#00c896">
    Alberto Bonguele
  </text>

  <!-- rotating role subtitle -->
  <text x="60" y="195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8b949e">
    <tspan opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.02;0.3;0.32;0.34;0.66;0.68;0.98;1" dur="9s" repeatCount="indefinite"/>
      Data Engineer
    </tspan>
  </text>
  <text x="60" y="195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8b949e">
    <tspan opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.02;0.3;0.32;0.34;0.66;0.68;0.98;1" dur="9s" repeatCount="indefinite"/>
      Référent Apache NiFi
    </tspan>
  </text>
  <text x="60" y="195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8b949e">
    <tspan opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.02;0.3;0.32;0.34;0.66;0.68;0.98;1" dur="9s" repeatCount="indefinite"/>
      En recherche d'alternance — sept. 2026
    </tspan>
  </text>
</svg>
