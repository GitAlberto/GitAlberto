<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="280" fill="#0d1117"/>

  <!-- data flow motif: nodes connected by lines, right side -->
  <g stroke="#00c896" stroke-width="1.5" fill="none" opacity="0.55">
    <line x1="760" y1="70" x2="880" y2="70"/>
    <line x1="880" y1="70" x2="880" y2="140"/>
    <line x1="880" y1="140" x2="1000" y2="140"/>
    <line x1="1000" y1="140" x2="1000" y2="60"/>
    <line x1="1000" y1="60" x2="1100" y2="60"/>
    <line x1="880" y1="140" x2="880" y2="210"/>
    <line x1="880" y1="210" x2="1020" y2="210"/>
  </g>
  <g fill="#00c896">
    <circle cx="760" cy="70" r="5"/>
    <circle cx="880" cy="70" r="5"/>
    <circle cx="880" cy="140" r="5"/>
    <circle cx="1000" cy="140" r="5"/>
    <circle cx="1000" cy="60" r="5"/>
    <circle cx="1100" cy="60" r="5"/>
    <circle cx="880" cy="210" r="5"/>
    <circle cx="1020" cy="210" r="5"/>
  </g>

  <!-- text block -->
  <text x="60" y="110" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f0f6fc">
    ALBERTO BONGUELE
  </text>
  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8b949e">
    Data Engineer — Apache NiFi, PostgreSQL, pipelines en production
  </text>
  <text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#00c896">
    En recherche d'alternance — septembre 2026
  </text>
</svg>
